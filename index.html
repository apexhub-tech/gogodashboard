<title>Go Go Hankuk Admin</title>
<meta name="description" content="Working admin dashboard for Go Go Hankuk — appointments, news, banners and team profiles." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#09243b; --navy-hover:#0f3352;
    --blue:#087fbc; --blue-dark:#066a9e;
    --bg:#f5f8fa; --white:#ffffff;
    --ink:#17384d; --muted:#637d8b;
    --tint:#e9f5fc; --line:#e1e9ee;
    --green:#158064; --green-bg:#e8f6f0;
    --amber:#976517; --amber-bg:#fff3dc;
    --red:#ba4c50; --red-bg:#fbe9ea;
    --side-text:#c7d7e0; --side-sub:#7fa6bb; --side-meta:#92b0c0;
    --radius-lg:14px; --radius-md:10px; --radius-sm:8px; --radius-pill:999px;
    --shadow-pop: 0 20px 48px -12px rgba(9,36,59,0.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{margin:0;}
  /* Figma uses Manrope Bold for every emphasized/heading element and DM Sans Regular for body text.
     Every bold weight in this file (700/800, inline or via class) is mapped to Manrope here so the
     mapping holds everywhere at once, rather than per-element. */
  h1,h2,h3,
  .h-manrope, .btn, .navlabel, .tabbtn, .th, .kpi-value, .cardtitle, th,
  .status-pill, .pill, .team-name, .shortcut-title, .backlink,
  [style*="font-weight:800"], [style*="font-weight: 800"],
  [style*="font-weight:700"], [style*="font-weight: 700"]{
    font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;
  }
  button{font:inherit; cursor:pointer;}
  input, select, textarea{font:inherit;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
  ::selection{background:var(--tint); color:var(--ink);}

  .icon{width:20px;height:20px;display:inline-flex;flex:none;}
  .icon svg{width:100%;height:100%;display:block;}

  /* ---------- app shell ---------- */
  #app{min-height:100%;}
  .shell{
    display:flex; min-height:100vh; width:100%;
    max-width:1440px; margin:0 auto; background:var(--bg);
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:240px; flex:none; background:var(--navy); color:var(--white);
    display:flex; flex-direction:column; gap:32px; padding:24px;
    position:sticky; top:0; align-self:flex-start; height:100vh;
    overflow-y:auto;
  }
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand .name{font-weight:800; font-size:18px; letter-spacing:0.2px;}
  .brand .sub{font-size:10px; letter-spacing:1.2px; color:var(--side-sub); font-weight:700; text-transform:uppercase;}
  .nav{display:flex; flex-direction:column; gap:8px;}
  .nav-label{font-size:10px; letter-spacing:1.2px; color:var(--side-sub); font-weight:700; text-transform:uppercase; margin:0 0 2px 2px;}
  .navitem{
    display:flex; align-items:center; gap:12px; height:46px; padding-left:14px;
    border-radius:var(--radius-sm); color:var(--side-text); font-size:13px; font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .navitem .icon{color:inherit;}
  .navitem:hover{background:rgba(255,255,255,0.06); color:var(--white);}
  .navitem.active{background:var(--blue); color:var(--white); font-weight:700;}
  .sidebar-spacer{flex:1;}
  .sidebar-link{display:flex; align-items:center; gap:10px; height:44px; color:var(--side-text); font-size:13px;}
  .sidebar-link:hover{color:var(--white);}
  .account{display:flex; align-items:center; gap:10px;}
  .avatar{
    width:34px; height:34px; border-radius:17px; background:var(--blue);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;
  }
  .account .who{font-weight:800; font-size:12px;}
  .account .org{font-size:11px; color:var(--side-meta);}

  /* ---------- main / topbar ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    height:76px; background:var(--white); display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
  }
  .crumb{font-size:13px; color:var(--muted);}
  .crumb b{color:var(--ink); font-weight:700;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .pill{display:inline-flex; align-items:center; justify-content:center; height:26px; padding:0 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:500; white-space:nowrap;}
  .pill-blue{background:var(--tint); color:var(--blue);}
  .pill-green{background:var(--green-bg); color:var(--green);}
  .pill-amber{background:var(--amber-bg); color:var(--amber);}
  .meta{font-size:12px; color:var(--muted);}

  .content{padding:40px; display:flex; flex-direction:column; gap:24px; max-width:1200px; width:100%;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:42px; padding:0 18px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-weight:700; font-size:13px; white-space:nowrap; transition:filter .12s ease, background .12s ease;
  }
  .btn-primary{background:var(--blue); color:var(--white);}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{background:var(--white); border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-ghost.active{background:var(--blue); border-color:var(--blue); color:var(--white);}
  .btn-danger-text{color:var(--red); font-weight:700; font-size:13px; background:none; border:none; padding:0;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{height:36px; padding:0 14px; font-size:12.5px;}

  /* ---------- page heading ---------- */
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .page-head h1{font-weight:800; font-size:28px; letter-spacing:-.2px;}
  .page-head .desc{font-size:14px; color:var(--muted); margin-top:6px; max-width:640px;}
  .backlink{display:inline-flex; align-items:center; gap:6px; color:var(--blue); font-size:13px; font-weight:500;}
  .backlink:hover{text-decoration:underline;}

  /* ---------- cards ---------- */
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px;}
  .cardtitle{font-weight:800; font-size:18px;}
  .banner-card{
    background:var(--tint); border-radius:var(--radius-lg); padding:24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .banner-card .big{font-weight:800; font-size:20px;}
  .banner-card .sub{color:var(--muted); font-size:14px; margin-top:6px;}

  /* ---------- kpi grid ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .kpi{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 22px; display:flex; flex-direction:column; gap:8px;}
  .kpi .label{font-size:12px; color:var(--muted);}
  .kpi-value{font-weight:800; font-size:30px; font-variant-numeric:tabular-nums;}
  .kpi .foot{font-size:12px; color:var(--muted);}

  /* ---------- two column ---------- */
  .two-col{display:grid; grid-template-columns:1.85fr 1fr; gap:24px; align-items:start;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);} }

  /* ---------- table ---------- */
  .tablewrap{width:100%; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:560px;}
  thead tr{background:var(--bg);}
  th{text-align:left; font-size:11px; letter-spacing:.3px; color:var(--muted); font-weight:800; padding:12px 16px; text-transform:uppercase;}
  td{padding:14px 16px; font-size:13px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr{transition:background .1s ease;}
  tbody tr.clickable:hover{background:var(--bg); cursor:pointer;}
  .status-pill{display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:500;}
  .linklike{color:var(--blue); font-weight:700; cursor:pointer;}

  /* ---------- shortcuts ---------- */
  .shortcut{display:flex; align-items:center; gap:12px; padding:6px 0; cursor:pointer; border-radius:8px;}
  .shortcut:hover .shortcut-title{color:var(--blue);}
  .shortcut-ico{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none;}
  .shortcut-title{font-weight:800; font-size:14px;}
  .shortcut-sub{font-size:12px; color:var(--muted);}

  /* ---------- tabs / filters ---------- */
  .tabs{display:flex; gap:10px; flex-wrap:wrap;}
  .filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:8px;}
  .field label{font-weight:800; font-size:12px;}
  .search-box{
    display:flex; align-items:center; gap:10px; height:42px; padding:0 14px;
    border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--white); color:var(--muted);
    min-width:220px;
  }
  .search-box input{border:none; outline:none; background:none; width:100%; color:var(--ink); font-size:13px;}
  .search-box input::placeholder{color:var(--muted);}
  select.selectlike, .selectlike{
    height:42px; padding:0 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--white); color:var(--ink); font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center; text-align:center; white-space:nowrap;
  }

  /* ---------- form fields ---------- */
  .form-row{display:flex; flex-direction:column; gap:8px; width:100%;}
  .form-row label{font-weight:800; font-size:12px;}
  .form-row .hint{font-size:11px; color:var(--muted); font-weight:400;}
  .input, textarea.input, select.input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; font-size:14px;
    color:var(--ink); background:var(--white); outline:none; font-family:inherit;
  }
  .input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(8,127,188,.12);}
  textarea.input{resize:vertical; min-height:64px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .toggle-row .lbl{font-weight:800; font-size:13px;}
  .switch{position:relative; width:42px; height:24px; border-radius:12px; background:var(--line); flex:none; transition:background .15s ease; border:none; padding:0;}
  .switch::after{content:"";position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--white); transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch.on{background:var(--green);}
  .switch.on::after{transform:translateX(18px);}

  .note-tint{background:var(--tint); border-radius:var(--radius-md); padding:16px 18px; display:flex; align-items:center; gap:12px; color:var(--blue); font-size:13px;}
  .note-tint .icon{color:var(--blue);}
  .note-plain{color:var(--muted); font-size:12px;}

  /* ---------- pagination ---------- */
  .pagination{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .pagerow{display:flex; gap:2px; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
  .pagerow button{border:none; background:var(--white); height:42px; min-width:38px; padding:0 10px; font-weight:700; color:var(--ink);}
  .pagerow button.current{background:var(--blue); color:var(--white);}
  .pagerow button:hover:not(.current){background:var(--bg);}

  /* ---------- banner preview ---------- */
  .banner-hero{
    height:272px; border-radius:var(--radius-md); padding:45px 28px 28px; color:var(--white);
    display:flex; flex-direction:column; gap:14px; align-items:flex-start; justify-content:flex-start;
    background-size:cover; background-position:center; position:relative; overflow:hidden;
  }
  .banner-hero::before{content:"";position:absolute; inset:0; background:linear-gradient(120deg, rgba(9,36,59,.55), rgba(9,36,59,.15));}
  .banner-hero > *{position:relative;}
  .banner-hero .title{font-weight:800; font-size:28px;}
  .banner-hero .subtitle{font-size:17px;}
  .order-row{display:flex; align-items:center; gap:14px; height:58px; padding:0 12px; border-radius:var(--radius-sm); cursor:pointer;}
  .order-row .grip{color:var(--muted); font-size:15px; letter-spacing:2px;}
  .order-row .num{font-size:12px; color:var(--muted); width:16px;}
  .order-row .name{font-weight:800; font-size:13px; flex:1;}

  /* ---------- team rows ---------- */
  .team-row{display:flex; align-items:center; gap:16px; height:auto; min-height:66px; padding:12px 16px; border-radius:9px; flex-wrap:wrap;}
  .team-photo{width:44px; height:44px; border-radius:22px; background:var(--tint); color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;}
  .team-namewrap{min-width:180px;}
  .team-name{font-weight:800; font-size:14px;}
  .team-role{font-size:12px; color:var(--muted);}
  .team-group{font-size:13px; color:var(--muted); min-width:110px;}

  /* ---------- news editor ---------- */
  .toolbar-fake{height:44px; background:var(--bg); display:flex; align-items:center; padding-left:16px; color:var(--muted); font-size:12px; border-radius:8px 8px 0 0; overflow-x:auto; white-space:nowrap;}
  .editorbody{border:1px solid var(--line); border-top:none; border-radius:0 0 8px 8px; padding:20px; display:flex; flex-direction:column; gap:12px;}
  .editorbody h3{font-weight:800; font-size:18px;}
  .upload-drop{
    background:var(--bg); border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:20px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .upload-ico{width:36px;height:36px;color:var(--blue);flex:none;}
  .upload-title{font-weight:800; font-size:14px;}
  .upload-sub{font-size:12px; color:var(--muted);}

  /* ---------- modal / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(9,36,59,.45); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal{background:var(--white); border-radius:16px; padding:28px; width:100%; max-width:480px; box-shadow:var(--shadow-pop); display:flex; flex-direction:column; gap:16px; max-height:86vh; overflow-y:auto;}
  .modal.wide{max-width:640px;}
  .modal h2{font-weight:800; font-size:20px;}
  .modal .modal-desc{color:var(--muted); font-size:13px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:4px;}
  .swatch-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .swatch{aspect-ratio:16/10; border-radius:10px; border:2px solid transparent; cursor:pointer; background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:8px; color:#fff; font-size:11px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .swatch.selected{border-color:var(--blue); box-shadow:0 0 0 3px rgba(8,127,188,.2);}

  .toast-wrap{position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:10px; z-index:60;}
  .toast{
    background:var(--navy); color:var(--white); padding:14px 18px; border-radius:var(--radius-sm);
    display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; box-shadow:var(--shadow-pop);
    animation:toastin .18s ease;
  }
  .toast .icon{color:var(--green);}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- preview panel (profile / news) ---------- */
  .preview-portrait{
    background:var(--tint); border-radius:12px; height:235px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px;
  }
  .preview-portrait .team-photo{width:92px; height:92px; border-radius:46px; font-size:28px;}
  .preview-sub{font-size:12px; color:var(--muted);}

  /* ---------- mobile ---------- */
  .menu-btn{display:none;}
  @media (max-width:840px){
    .shell{flex-direction:column;}
    .sidebar{
      position:fixed; z-index:40; left:0; top:0; height:100vh; transform:translateX(-100%);
      transition:transform .2s ease; box-shadow:24px 0 48px rgba(0,0,0,.25);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{position:fixed; inset:0; background:rgba(9,36,59,.5); z-index:39;}
    .topbar{padding:0 16px;}
    .content{padding:20px 16px;}
    .menu-btn{display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--white); color:var(--ink); margin-right:10px;}
    .topbar-left{display:flex; align-items:center;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .page-head{flex-direction:column;}
    .card{padding:18px;}
  }
  @media (max-width:480px){
    .kpi-grid{grid-template-columns:1fr;}
  }
</style>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================== ICONS ============================== */
const ICON = {
  grid:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>`,
  calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`,
  news:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>`,
  image:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L4 19"/></svg>`,
  banner:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="7" cy="12" r="1.7"/><path d="M11 14.5l2-2 2.5 2.5 2.5-3" /></svg>`,
  users:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.2" cy="8.6" r="2.6"/><path d="M16 14.2c2.7.4 4.5 2.4 4.5 5.6"/></svg>`,
  link:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 1 1 5.5 5.5l-1 1"/><path d="M13 17.5l-1 1A4 4 0 1 1 6.5 13l1-1"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  upload:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>`,
  arrowleft:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`,
  x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  menu:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
};
function icon(name){ return `<span class="icon">${ICON[name]||''}</span>`; }

/* ============================== DATA ============================== */
const uid = (()=>{let n=1000; return (p)=>`${p}-${n++}`;})();

/* ============================== HELPERS ============================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function statusPill(status){
  const map = {
    pending:['pill-amber','Pending'], confirmed:['pill-green','Confirmed'], completed:['pill-blue','Completed'],
    published:['pill-green','Published'], draft:['pill-amber','Draft'],
  };
  const [cls,label] = map[status] || ['pill-blue', status];
  return `<span class="status-pill ${cls}">${label}</span>`;
}
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon('check')}<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(), 260); }, 2400);
}
function closeModal(){ const m = document.getElementById('modalRoot'); if(m) m.remove(); }
function openModal(html){
  closeModal();
  const div = document.createElement('div');
  div.id = 'modalRoot';
  div.className = 'overlay';
  div.innerHTML = html;
  div.addEventListener('click', (e)=>{ if(e.target === div) closeModal(); });
  document.body.appendChild(div);
}

/* ============================== RENDER ============================== */
function render(){
  const parts = currentRoute();
  const root = parts[0] || 'overview';
  let html = '';
  if(root==='overview') html = pageOverview();
  else if(root==='appointments' && parts[1]) html = pageAppointmentDetail(parts[1]);
  else if(root==='appointments') html = pageAppointments();
  else if(root==='news' && parts[1]==='new') html = pageNewsEditor('new');
  else if(root==='news' && parts[1]) html = pageNewsEditor(parts[1]);
  else if(root==='news') html = pageNews();
  else if(root==='main-banner') html = pageMainBanner();
  else if(root==='banners') html = pageBanners();
  else if(root==='team' && parts[1]==='new') html = pageProfileEditor('new');
  else if(root==='team' && parts[1]) html = pageProfileEditor(parts[1]);
  else if(root==='team') html = pageTeam();
  else html = pageOverview();

  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
  wireSearchInputs();
}
function wireSearchInputs(){
  const a = document.getElementById('apptSearchInput');
  if(a) a.addEventListener('input', e=>{ apptSearch = e.target.value; render(); a.focus(); a.setSelectionRange(a.value.length, a.value.length); });
  const n = document.getElementById('newsSearchInput');
  if(n) n.addEventListener('input', e=>{ newsSearch = e.target.value; render(); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const t = document.getElementById('teamSearchInput');
  if(t) t.addEventListener('input', e=>{ teamSearch = e.target.value; render(); t.focus(); t.setSelectionRange(t.value.length, t.value.length); });
}

/* ============================== EVENT DELEGATION ============================== */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  const actionEl = e.target.closest('[data-action]');

  if(navEl){
    e.preventDefault();
    navigate('#/' + navEl.getAttribute('data-nav'));
    STATE.sidebarOpen = false;
    return;
  }
  if(!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  const id = actionEl.getAttribute('data-id');

  switch(action){
    case 'toggle-sidebar': STATE.sidebarOpen = !STATE.sidebarOpen; render(); break;
    case 'close-sidebar': STATE.sidebarOpen = false; render(); break;
    case 'view-website': toast('This demo workspace has no live website connected.'); break;
    case 'add-appointment': toast('Appointment creation is not available in this demo.'); break;
    case 'appt-filter': apptFilter = actionEl.getAttribute('data-val'); render(); break;
    case 'news-filter': newsFilter = actionEl.getAttribute('data-val'); render(); break;
    case 'team-filter': teamFilter = actionEl.getAttribute('data-val'); render(); break;

    case 'confirm-appt': {
      const a = DATA.appointments.find(x=>x.id===id);
      if(a){ a.status = 'confirmed'; a.counsellor = document.getElementById('apptCounsellor')?.value || a.counsellor; }
      toast('Appointment confirmed');
      render();
      break;
    }
    case 'propose-time': toast('A new time proposal has been sent to the student.'); break;
    case 'cancel-appt': {
      const a = DATA.appointments.find(x=>x.id===id);
      if(a) a.status = 'completed';
      toast('Request cancelled');
      navigate('#/appointments');
      break;
    }

    case 'news-save-draft': saveNewsForm(id, 'draft'); toast('Draft saved'); render(); break;
    case 'news-publish': {
      const draftId = collectNewsForm(id);
      modalConfirmPublish(draftId);
      break;
    }
    case 'do-publish': {
      saveNewsForm(id, 'published');
      closeModal();
      toast('News published to your website');
      navigate('#/news');
      break;
    }
    case 'news-preview': {
      const tempId = collectNewsForm(id);
      const n = DATA.news.find(x=>x.id===tempId);
      if(n) modalNewsPreview(n);
      break;
    }

    case 'select-banner': STATE.selectedBanner = id; render(); break;
    case 'toggle-banner-active': {
      const b = DATA.banners.find(x=>x.id===id);
      if(b) b.active = !b.active;
      render();
      break;
    }
    case 'save-main-banner': {
      const mb = DATA.mainBanner;
      if(STATE.mainBannerPending){ mb.image = STATE.mainBannerPending.dataUrl; }
      mb.alt = document.getElementById('mainBannerAlt')?.value ?? mb.alt;
      mb.updated = 'Just now';
      STATE.mainBannerPending = null;
      toast('Main banner updated');
      render();
      break;
    }
    case 'restore-main-banner': {
      DATA.mainBanner.image = ORIGINAL_MAIN_BANNER.image;
      DATA.mainBanner.alt = ORIGINAL_MAIN_BANNER.alt;
      DATA.mainBanner.updated = 'Original site graphic';
      STATE.mainBannerPending = null;
      toast('Restored the original banner graphic');
      render();
      break;
    }

    case 'save-banner': saveBannerForm(id); toast('Banner changes saved'); render(); break;
    case 'add-banner': toast('New banner slots are limited in this demo.'); break;

    case 'add-profile': navigate('#/team/new'); break;
    case 'profile-save': saveProfileForm(id); toast('Profile saved'); navigate('#/team'); break;
    case 'profile-preview': toast('Preview matches the panel on the right.'); break;
    case 'toggle-profile-visible': {
      const t = DATA.team.find(x=>x.id===id);
      if(t){ t.status = t.status==='published' ? 'draft' : 'published'; }
      render();
      break;
    }

    case 'choose-image': modalChooseImage(actionEl.getAttribute('data-target')); break;
    case 'pick-image': {
      const idx = Number(actionEl.getAttribute('data-idx'));
      const s = SWATCHES[idx];
      if(STATE.imagePicker==='bannerHero'){
        const b = DATA.banners.find(x=>x.id===STATE.selectedBanner);
        if(b) b.bg = s.bg;
      }
      closeModal();
      toast(`Image "${s.name}" selected`);
      render();
      break;
    }
    case 'close-modal': closeModal(); break;
  }
});

// Live-update the profile preview panel as the admin types
document.addEventListener('input', function(e){
  if(e.target.id==='profileName'){ const p=document.getElementById('previewName'); if(p) p.textContent = e.target.value || 'Full name'; }
  if(e.target.id==='profileRole'){ const p=document.getElementById('previewRole'); if(p) p.textContent = e.target.value || 'Position / title'; }
  if(e.target.id==='profileIntro'){ const p=document.getElementById('previewIntro'); if(p) p.textContent = e.target.value || 'Short introduction appears here.'; }
});

// Import-image handling for the Main Banner page: read the chosen file and
// preview it immediately, without waiting for a full re-render.
document.addEventListener('change', function(e){
  if(e.target.id==='mainBannerFileInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!/^image\/(png|jpeg|webp)$/.test(file.type)){
      toast('Please choose a PNG, JPG or WebP image');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(){
      STATE.mainBannerPending = { dataUrl: reader.result, name: file.name };
      const img = document.getElementById('mainBannerPreview');
      if(img) img.src = reader.result;
      const title = e.target.closest('.upload-drop')?.querySelector('.upload-title');
      if(title) title.textContent = file.name;
      toast(`"${file.name}" ready — click Save Changes to apply it`);
    };
    reader.readAsDataURL(file);
  }
});

function collectNewsForm(id){
  const isNew = !id;
  let n = isNew ? null : DATA.news.find(x=>x.id===id);
  const title = document.getElementById('newsTitle')?.value ?? (n?n.title:'');
  const desc = document.getElementById('newsDesc')?.value ?? (n?n.desc:'');
  const category = document.getElementById('newsCategory')?.value ?? (n?n.category:'Student guide');
  const author = document.getElementById('newsAuthor')?.value ?? (n?n.author:'Go Go Hankuk');
  const slug = document.getElementById('newsSlug')?.value ?? (n?n.slug:'');
  const body = document.getElementById('newsBody')?.value ?? (n?n.body:'');
  if(!n){
    n = {id: uid('N'), title, desc, category, author, slug, body, status:'draft', updated:'Just now', publishDate:'Publish immediately'};
    DATA.news.unshift(n);
  } else {
    Object.assign(n, {title, desc, category, author, slug, body});
  }
  return n.id;
}
function saveNewsForm(id, status){
  const newId = collectNewsForm(id);
  const n = DATA.news.find(x=>x.id===newId);
  if(n){ n.status = status; n.updated = 'Just now'; }
  if(!id) navigate('#/news/'+newId);
}
function saveBannerForm(id){
  const b = DATA.banners.find(x=>x.id===id);
  if(!b) return;
  b.title = document.getElementById('bannerTitle')?.value ?? b.title;
  b.subtitle = document.getElementById('bannerSubtitle')?.value ?? b.subtitle;
  b.button = document.getElementById('bannerButton')?.value ?? b.button;
  b.dest = document.getElementById('bannerDest')?.value ?? b.dest;
  b.alt = document.getElementById('bannerAlt')?.value ?? b.alt;
}
function saveProfileForm(id){
  const isNew = !id;
  let t = isNew ? null : DATA.team.find(x=>x.id===id);
  const name = document.getElementById('profileName')?.value ?? '';
  const role = document.getElementById('profileRole')?.value ?? '';
  const group = document.getElementById('profileGroup')?.value ?? 'Our Team';
  const order = Number(document.getElementById('profileOrder')?.value) || (DATA.team.length+1);
  const intro = document.getElementById('profileIntro')?.value ?? '';
  const bio = document.getElementById('profileBio')?.value ?? '';
  const initials = name.trim() ? name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('') : '--';
  if(!t){
    t = {id: uid('T'), name, role, group, order, intro, bio, status:'draft', initials};
    DATA.team.push(t);
  } else {
    Object.assign(t, {name, role, group, order, intro, bio, initials});
  }
}

/* ============================== INIT ============================== */
render();
</script>
